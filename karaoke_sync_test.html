<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Karaoke Sync Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 820px;
      margin: 24px auto;
      padding: 0 16px;
      line-height: 1.6;
    }

    h2 {
      margin-bottom: 8px;
    }

    .section {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }

    input,
    select,
    button {
      margin: 4px;
      padding: 6px 8px;
      font-size: 14px;
    }

    input {
      min-width: 280px;
    }

    input.small-input {
      min-width: 80px;
      width: 90px;
    }

    button {
      cursor: pointer;
    }

    #player {
      margin-top: 12px;
    }

    .status {
      font-weight: bold;
    }

    .list-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .list-controls input {
      min-width: 260px;
    }

    .song-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin: 8px 0;
      background: #fafafa;
    }

    .song-card.active-song {
      border: 2px solid #333;
      background: #f0f8ff;
    }

    .song-card-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .song-card-meta {
      font-size: 14px;
      color: #555;
    }

    .song-card-actions {
      margin-top: 6px;
    }

    .empty-message {
      color: #777;
    }

    .count-text {
      font-size: 14px;
      color: #555;
    }

    .active-label {
      display: inline-block;
      font-size: 12px;
      padding: 2px 6px;
      margin-left: 6px;
      border-radius: 999px;
      background: #333;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Karaoke Sync Test</h2>
  <p>カラオケ採点に合わせて、本人歌唱のYouTube動画をイヤホンで聴くための同期テストです。</p>

  <div class="section">
    <h3>動画設定</h3>

    <input
      id="videoInput"
      placeholder="YouTube URL または 動画ID"
    >
    <button onclick="loadVideo()">動画を読み込む</button>

    <p>動画ID：<span id="currentVideoId">未読み込み</span></p>
    <p class="status">状態：<span id="videoStatus">動画未読み込み</span></p>

    <div id="player"></div>
  </div>

  <div class="section">
    <h3>曲情報</h3>

    <input id="songTitle" placeholder="曲名">
    <input id="artistName" placeholder="アーティスト名">

    <select id="karaokeService">
      <option value="">機種を選択</option>
      <option value="DAM">DAM</option>
      <option value="JOYSOUND">JOYSOUND</option>
    </select>

    <button onclick="saveSongInfo()">曲情報を保存</button>

    <p>保存状態：<span id="songInfoStatus">未保存</span></p>
  </div>

  <div class="section">
    <h3>保存済み曲リスト</h3>

    <div class="list-controls">
      <input
        id="songSearchInput"
        placeholder="曲名・アーティスト・機種・動画IDで検索"
        oninput="renderSongList()"
      >

      <select id="songSortSelect" onchange="renderSongList()">
        <option value="newest">新しい順</option>
        <option value="title">曲名順</option>
        <option value="artist">アーティスト順</option>
        <option value="service">機種順</option>
      </select>

      <button onclick="clearSongSearch()">検索クリア</button>
      <button onclick="renderSongList()">曲リストを更新</button>
    </div>

    <p class="count-text">表示件数：<span id="songListCount">0</span>件</p>

    <div id="songList"></div>
  </div>

  <div class="section">
    <h3>同期設定</h3>

    <p>現在位置：<span id="current">0.00</span>秒</p>
    <p>保存位置：<span id="saved">未保存</span></p>

    <button onclick="play()">再生</button>
    <button onclick="pause()">停止</button>
    <button onclick="seek(-0.1)">-0.1秒</button>
    <button onclick="seek(0.1)">+0.1秒</button>
    <button onclick="save()">今合ってる</button>
    <button onclick="playSaved()">保存位置から再生</button>
  </div>

  <div class="section">
    <h3>音検知設定</h3>

    <p>検知状態：<span id="detectStatus">停止中</span></p>
    <p>現在音量：<span id="volume">0.000</span></p>
    <p>検知補正：<span id="detectOffset">0.00</span>秒</p>

    <label>
      音量しきい値：
      <input
        id="detectThreshold"
        class="small-input"
        type="number"
        min="0"
        max="1"
        step="0.005"
        value="0.080"
        onchange="updateDetectThresholdFromInput()"
      >
    </label>

    <br><br>

    <button onclick="changeDetectOffset(-0.1)">補正 -0.1秒</button>
    <button onclick="changeDetectOffset(0.1)">補正 +0.1秒</button>

    <br><br>

    <button onclick="changeDetectThreshold(-0.005)">しきい値 -0.005</button>
    <button onclick="changeDetectThreshold(0.005)">しきい値 +0.005</button>
    <button onclick="saveDetectSettings()">検知設定を保存</button>

    <br><br>

    <button onclick="startMicDetect()">音検知スタート</button>
    <button onclick="stopMicDetect()">音検知停止</button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let videoId = "";
    let savedSec = null;
    let detectOffsetSec = 0.0;
    let detectThreshold = 0.08;

    let audioContext;
    let analyser;
    let micSource;
    let micStream;
    let dataArray;
    let detecting = false;

    const defaultThreshold = 0.08;
    const songListKey = "song_list";
    const backupVersion = "0.6";

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        height: "240",
        width: "360",
        videoId: "",
        playerVars: {
          playsinline: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });

      setInterval(updateCurrentTime, 100);
    }

    function onPlayerReady() {
      setVideoStatus("YouTubeプレイヤー準備完了");
      renderSongList();
      setupBackupControls();
      updateDetectSettingsView();
    }

    function onPlayerStateChange(event) {
      if (!videoId) return;

      if (event.data === YT.PlayerState.PLAYING) {
        setVideoStatus("再生中");
      } else if (event.data === YT.PlayerState.PAUSED) {
        setVideoStatus("一時停止中");
      } else if (event.data === YT.PlayerState.ENDED) {
        setVideoStatus("再生終了");
      } else if (event.data === YT.PlayerState.CUED) {
        setVideoStatus("動画を読み込みました。再生できます。");
      }
    }

    function onPlayerError(event) {
      if (event.data === 2) {
        setVideoStatus("動画IDが正しくありません。URLを確認してください。");
      } else if (event.data === 5) {
        setVideoStatus("この動画はHTML5プレイヤーで再生できません。");
      } else if (event.data === 100) {
        setVideoStatus("動画が見つかりません。削除または非公開の可能性があります。");
      } else if (event.data === 101 || event.data === 150) {
        setVideoStatus("この動画は埋め込み再生できません。別の動画を選んでください。");
      } else {
        setVideoStatus("再生エラーが発生しました。エラーコード：" + event.data);
      }
    }

    function extractYouTubeVideoId(input) {
      const text = input.trim();

      if (/^[a-zA-Z0-9_-]{11}$/.test(text)) {
        return text;
      }

      try {
        const url = new URL(text);
        const hostname = url.hostname.replace("www.", "");

        if (hostname === "youtu.be") {
          const id = url.pathname.split("/").filter(Boolean)[0];
          return isValidVideoId(id) ? id : null;
        }

        if (hostname.endsWith("youtube.com")) {
          const watchId = url.searchParams.get("v");

          if (isValidVideoId(watchId)) {
            return watchId;
          }

          const parts = url.pathname.split("/").filter(Boolean);
          const targetPaths = ["embed", "shorts", "live"];

          for (const targetPath of targetPaths) {
            const index = parts.indexOf(targetPath);

            if (index !== -1) {
              const id = parts[index + 1];
              return isValidVideoId(id) ? id : null;
            }
          }
        }
      } catch (error) {
        // URLではない入力の場合は、下の正規表現で判定する
      }

      const match = text.match(/([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    function isValidVideoId(id) {
      return typeof id === "string" && /^[a-zA-Z0-9_-]{11}$/.test(id);
    }

    function loadVideo() {
      const input = document.getElementById("videoInput").value;
      const extractedVideoId = extractYouTubeVideoId(input);

      if (!extractedVideoId) {
        alert("YouTube URLまたは動画IDを正しく入力してね");
        return;
      }

      if (!player || typeof player.loadVideoById !== "function") {
        alert("YouTubeプレイヤーの準備がまだできていません。少し待ってから試してね");
        return;
      }

      videoId = extractedVideoId;

      document.getElementById("currentVideoId").textContent = videoId;
      setVideoStatus("動画を読み込み中：" + videoId);

    player.cueVideoById(videoId);

      loadSavedPosition();
      loadSongInfo();
      loadDetectSettings();
      renderSongList();
    }

    function loadVideoFromList(selectedVideoId) {
      document.getElementById("videoInput").value = selectedVideoId;
      loadVideo();
    }

    function loadSavedPosition() {
      if (!videoId) return;

      savedSec = localStorage.getItem("sync_" + videoId);

      document.getElementById("saved").textContent =
        savedSec !== null ? Number(savedSec).toFixed(2) + "秒" : "未保存";
    }

    function play() {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      player.playVideo();
    }

    function pause() {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      player.pauseVideo();
    }

    function seek(diff) {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      const t = player.getCurrentTime();
      player.seekTo(Math.max(0, t + diff), true);
    }

    function save() {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      savedSec = player.getCurrentTime();
      localStorage.setItem("sync_" + videoId, savedSec);
      addVideoToSongList(videoId);

      document.getElementById("saved").textContent =
        Number(savedSec).toFixed(2) + "秒";

      renderSongList();
    }

function playSaved() {
  if (!videoId) {
    alert("先に動画を読み込んでね");
    return;
  }

  if (savedSec === null) {
    alert("先に保存位置を作ってね");
    return;
  }

  const startSec = Math.max(0, Number(savedSec) + detectOffsetSec);

  player.seekTo(startSec, true);
  player.playVideo();
}

    function updateCurrentTime() {
      if (!player || typeof player.getCurrentTime !== "function") return;

      try {
        document.getElementById("current").textContent =
          player.getCurrentTime().toFixed(2);
      } catch (error) {
        // プレイヤー準備前は何もしない
      }
    }

    function changeDetectOffset(diff) {
      detectOffsetSec += diff;
      detectOffsetSec = Math.round(detectOffsetSec * 100) / 100;
      updateDetectSettingsView();
    }

    function changeDetectThreshold(diff) {
      detectThreshold += diff;
      detectThreshold = Math.max(0, Math.min(1, detectThreshold));
      detectThreshold = Math.round(detectThreshold * 1000) / 1000;
      updateDetectSettingsView();
    }

    function updateDetectThresholdFromInput() {
      const inputValue = Number(document.getElementById("detectThreshold").value);

      if (Number.isNaN(inputValue)) {
        detectThreshold = defaultThreshold;
      } else {
        detectThreshold = Math.max(0, Math.min(1, inputValue));
      }

      detectThreshold = Math.round(detectThreshold * 1000) / 1000;
      updateDetectSettingsView();
    }

    function updateDetectSettingsView() {
      document.getElementById("detectOffset").textContent =
        detectOffsetSec.toFixed(2);

      document.getElementById("detectThreshold").value =
        detectThreshold.toFixed(3);
    }

    function saveDetectSettings() {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      updateDetectThresholdFromInput();

      const detectSettings = {
        offset: detectOffsetSec,
        threshold: detectThreshold
      };

      localStorage.setItem("detect_settings_" + videoId, JSON.stringify(detectSettings));
      addVideoToSongList(videoId);
      renderSongList();

      document.getElementById("detectStatus").textContent =
        "検知設定を保存しました";
    }

    function loadDetectSettings() {
      if (!videoId) return;

      const rawDetectSettings = localStorage.getItem("detect_settings_" + videoId);

      if (!rawDetectSettings) {
        detectOffsetSec = 0.0;
        detectThreshold = defaultThreshold;
        updateDetectSettingsView();
        document.getElementById("detectStatus").textContent =
          "検知設定は未保存です";
        return;
      }

      try {
        const detectSettings = JSON.parse(rawDetectSettings);

        detectOffsetSec = Number(detectSettings.offset) || 0.0;
        detectThreshold = Number(detectSettings.threshold) || defaultThreshold;

        updateDetectSettingsView();

        document.getElementById("detectStatus").textContent =
          "検知設定を読み込みました";

      } catch (error) {
        detectOffsetSec = 0.0;
        detectThreshold = defaultThreshold;
        updateDetectSettingsView();

        document.getElementById("detectStatus").textContent =
          "検知設定の読み込みに失敗しました";
      }
    }

    async function startMicDetect() {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      if (savedSec === null) {
        alert("先に保存位置を作ってね");
        return;
      }

      try {
        updateDetectThresholdFromInput();
        stopMicDetect("音検知を再準備しています");

// iPhone + Bluetoothイヤホン向け：録音と再生を同時利用する設定を試す
if ("audioSession" in navigator) {
  try {
    navigator.audioSession.type = "play-and-record";
    console.log("audioSession before mic:", navigator.audioSession.type);
  } catch (e) {
    console.log("audioSession setting failed before mic:", e);
  }
}

micStream = await navigator.mediaDevices.getUserMedia({
  audio: {
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false
  }
});

// マイク取得後にも再設定して、出力先が戻るか確認する
if ("audioSession" in navigator) {
  try {
    navigator.audioSession.type = "play-and-record";
    console.log("audioSession after mic:", navigator.audioSession.type);
  } catch (e) {
    console.log("audioSession setting failed after mic:", e);
  }
}

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        micSource = audioContext.createMediaStreamSource(micStream);

        analyser.fftSize = 2048;
        dataArray = new Uint8Array(analyser.fftSize);

        micSource.connect(analyser);

        detecting = true;
        document.getElementById("detectStatus").textContent =
          "音検知中。しきい値 " + detectThreshold.toFixed(3) + " を超えたら再生します。";

        detectVolume();

      } catch (error) {
        alert("マイクが使えませんでした");
        document.getElementById("detectStatus").textContent =
          "マイク取得に失敗しました";
        console.error(error);
      }
    }

    function detectVolume() {
      if (!detecting) return;

      analyser.getByteTimeDomainData(dataArray);

      let sum = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const v = (dataArray[i] - 128) / 128;
        sum += v * v;
      }

      const volume = Math.sqrt(sum / dataArray.length);
      document.getElementById("volume").textContent = volume.toFixed(3);

if (volume > detectThreshold) {
  stopMicDetect("検知成功。保存位置から再生します。");
  playSaved();
  return;
}

      requestAnimationFrame(detectVolume);
    }

    function stopMicDetect(message = "停止中") {
      detecting = false;

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      document.getElementById("detectStatus").textContent = message;
    }

    function saveSongInfo() {
      if (!videoId) {
        alert("先に動画を読み込んでね");
        return;
      }

      const songInfo = {
        title: document.getElementById("songTitle").value.trim(),
        artist: document.getElementById("artistName").value.trim(),
        service: document.getElementById("karaokeService").value
      };

      localStorage.setItem("song_info_" + videoId, JSON.stringify(songInfo));
      addVideoToSongList(videoId);

      document.getElementById("songInfoStatus").textContent =
        "保存済み：" + formatSongInfo(songInfo);

      renderSongList();
    }

    function loadSongInfo() {
      if (!videoId) return;

      const rawSongInfo = localStorage.getItem("song_info_" + videoId);

      if (!rawSongInfo) {
        document.getElementById("songTitle").value = "";
        document.getElementById("artistName").value = "";
        document.getElementById("karaokeService").value = "";
        document.getElementById("songInfoStatus").textContent = "未保存";
        return;
      }

      try {
        const songInfo = JSON.parse(rawSongInfo);

        document.getElementById("songTitle").value = songInfo.title || "";
        document.getElementById("artistName").value = songInfo.artist || "";
        document.getElementById("karaokeService").value = songInfo.service || "";

        document.getElementById("songInfoStatus").textContent =
          "読み込み済み：" + formatSongInfo(songInfo);

      } catch (error) {
        document.getElementById("songInfoStatus").textContent =
          "曲情報の読み込みに失敗しました";
      }
    }

    function formatSongInfo(songInfo) {
      const title = songInfo.title || "曲名未入力";
      const artist = songInfo.artist || "アーティスト未入力";
      const service = songInfo.service || "機種未選択";

      return title + " / " + artist + " / " + service;
    }

    function getSongList() {
      const rawSongList = localStorage.getItem(songListKey);

      if (!rawSongList) {
        return [];
      }

      try {
        const list = JSON.parse(rawSongList);
        return Array.isArray(list) ? list : [];
      } catch (error) {
        return [];
      }
    }

    function saveSongList(list) {
      localStorage.setItem(songListKey, JSON.stringify(list));
    }

    function addVideoToSongList(targetVideoId) {
      const list = getSongList().filter(id => id !== targetVideoId);
      list.unshift(targetVideoId);
      saveSongList(list);
    }

    function removeVideoFromSongList(targetVideoId) {
      const list = getSongList().filter(id => id !== targetVideoId);
      saveSongList(list);
    }

    function clearSongSearch() {
      document.getElementById("songSearchInput").value = "";
      document.getElementById("songSortSelect").value = "newest";
      renderSongList();
    }

    function getSongDisplayData(id) {
      const rawSongInfo = localStorage.getItem("song_info_" + id);
      const rawSavedSec = localStorage.getItem("sync_" + id);
      const rawDetectSettings = localStorage.getItem("detect_settings_" + id);

      let songInfo = {
        title: "曲名未入力",
        artist: "アーティスト未入力",
        service: "機種未選択"
      };

      let detectSettings = {
        offset: 0.0,
        threshold: defaultThreshold
      };

      if (rawSongInfo) {
        try {
          const parsedSongInfo = JSON.parse(rawSongInfo);
          songInfo = {
            title: parsedSongInfo.title || "曲名未入力",
            artist: parsedSongInfo.artist || "アーティスト未入力",
            service: parsedSongInfo.service || "機種未選択"
          };
        } catch (error) {
          // 壊れた曲情報は初期表示にする
        }
      }

      if (rawDetectSettings) {
        try {
          const parsedDetectSettings = JSON.parse(rawDetectSettings);
          detectSettings = {
            offset: Number(parsedDetectSettings.offset) || 0.0,
            threshold: Number(parsedDetectSettings.threshold) || defaultThreshold
          };
        } catch (error) {
          // 壊れた検知設定は初期表示にする
        }
      }

      return {
        id: id,
        title: songInfo.title,
        artist: songInfo.artist,
        service: songInfo.service,
        savedSec: rawSavedSec,
        offset: detectSettings.offset,
        threshold: detectSettings.threshold
      };
    }

    function getFilteredAndSortedSongDataList() {
      const searchText = document.getElementById("songSearchInput").value.trim().toLowerCase();
      const sortType = document.getElementById("songSortSelect").value;

      const dataList = getSongList().map(id => getSongDisplayData(id));

      const filteredList = dataList.filter(item => {
        const searchTarget = [
          item.title,
          item.artist,
          item.service,
          item.id
        ].join(" ").toLowerCase();

        return searchTarget.includes(searchText);
      });

      if (sortType === "title") {
        filteredList.sort((a, b) => a.title.localeCompare(b.title, "ja"));
      } else if (sortType === "artist") {
        filteredList.sort((a, b) => a.artist.localeCompare(b.artist, "ja"));
      } else if (sortType === "service") {
        filteredList.sort((a, b) => a.service.localeCompare(b.service, "ja"));
      }

      return filteredList;
    }

    function renderSongList() {
      const songListElement = document.getElementById("songList");
      songListElement.innerHTML = "";

      const filteredList = getFilteredAndSortedSongDataList();

      document.getElementById("songListCount").textContent = filteredList.length;

      if (filteredList.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty-message";
        emptyMessage.textContent = "条件に合う保存済み曲はありません。";
        songListElement.appendChild(emptyMessage);
        return;
      }

      for (const item of filteredList) {
        const card = document.createElement("div");
        card.className = "song-card";

        if (item.id === videoId) {
          card.classList.add("active-song");
        }

        const title = document.createElement("div");
        title.className = "song-card-title";
        title.textContent = item.title;

        if (item.id === videoId) {
          const activeLabel = document.createElement("span");
          activeLabel.className = "active-label";
          activeLabel.textContent = "読み込み中";
          title.appendChild(activeLabel);
        }

        const meta = document.createElement("div");
        meta.className = "song-card-meta";
        meta.textContent =
          item.artist + " / " +
          item.service + " / " +
          "保存位置：" + (item.savedSec !== null ? Number(item.savedSec).toFixed(2) + "秒" : "未保存");

        const detectMeta = document.createElement("div");
        detectMeta.className = "song-card-meta";
        detectMeta.textContent =
          "検知補正：" + item.offset.toFixed(2) + "秒 / " +
          "しきい値：" + item.threshold.toFixed(3);

        const idText = document.createElement("div");
        idText.className = "song-card-meta";
        idText.textContent = "動画ID：" + item.id;

        const actions = document.createElement("div");
        actions.className = "song-card-actions";

        const loadButton = document.createElement("button");
        loadButton.textContent = "読み込み";
        loadButton.onclick = function() {
          loadVideoFromList(item.id);
        };

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.onclick = function() {
          deleteSongData(item.id);
        };

        actions.appendChild(loadButton);
        actions.appendChild(deleteButton);

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(detectMeta);
        card.appendChild(idText);
        card.appendChild(actions);

        songListElement.appendChild(card);
      }
    }

    function setupBackupControls() {
      if (document.getElementById("backupControls")) {
        return;
      }

      const songListElement = document.getElementById("songList");

      if (!songListElement || !songListElement.parentElement) {
        return;
      }

      const container = document.createElement("div");
      container.id = "backupControls";
      container.style.marginTop = "16px";
      container.style.padding = "12px";
      container.style.border = "1px solid #ddd";
      container.style.borderRadius = "8px";

      const title = document.createElement("h3");
      title.textContent = "データのバックアップ・復元";

      const description = document.createElement("p");
      description.textContent = "保存済み曲リスト、再生位置、曲情報、音検知設定をJSONファイルとして保存・復元できます。";

      const exportButton = document.createElement("button");
      exportButton.textContent = "JSONでエクスポート";
      exportButton.onclick = exportBackupData;

      const importInput = document.createElement("input");
      importInput.type = "file";
      importInput.accept = "application/json,.json";
      importInput.style.display = "none";
      importInput.onchange = importBackupData;

      const importButton = document.createElement("button");
      importButton.textContent = "JSONから復元";
      importButton.onclick = function() {
        importInput.click();
      };

      const clearButton = document.createElement("button");
      clearButton.textContent = "全データ削除";
      clearButton.onclick = clearAllSavedData;

      const status = document.createElement("p");
      status.id = "backupStatus";
      status.textContent = "バックアップ機能は未実行です。";

      container.appendChild(title);
      container.appendChild(description);
      container.appendChild(exportButton);
      container.appendChild(importButton);
      container.appendChild(clearButton);
      container.appendChild(importInput);
      container.appendChild(status);

      songListElement.parentElement.insertBefore(container, songListElement);
    }

    function setBackupStatus(message) {
      const backupStatus = document.getElementById("backupStatus");

      if (backupStatus) {
        backupStatus.textContent = message;
      }
    }

    function createBackupData() {
      const songIds = getSongList();
      const songs = [];

      for (const id of songIds) {
        const rawSongInfo = localStorage.getItem("song_info_" + id);
        const rawSavedSec = localStorage.getItem("sync_" + id);
        const rawDetectSettings = localStorage.getItem("detect_settings_" + id);

        let songInfo = null;
        let detectSettings = null;

        try {
          songInfo = rawSongInfo ? JSON.parse(rawSongInfo) : null;
        } catch (error) {
          songInfo = null;
        }

        try {
          detectSettings = rawDetectSettings ? JSON.parse(rawDetectSettings) : null;
        } catch (error) {
          detectSettings = null;
        }

        songs.push({
          videoId: id,
          savedSec: rawSavedSec,
          songInfo: songInfo,
          detectSettings: detectSettings
        });
      }

      return {
        appName: "Karaoke Sync",
        backupVersion: backupVersion,
        exportedAt: new Date().toISOString(),
        songs: songs
      };
    }

    function exportBackupData() {
      const backupData = createBackupData();
      const json = JSON.stringify(backupData, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const now = new Date();
      const fileName =
        "karaoke-sync-backup-" +
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        ".json";

      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.click();

      URL.revokeObjectURL(url);

      setBackupStatus("バックアップJSONをエクスポートしました。");
    }

    function importBackupData(event) {
      const file = event.target.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const backupData = JSON.parse(e.target.result);

          if (!backupData || !Array.isArray(backupData.songs)) {
            setBackupStatus("復元できませんでした。JSON形式が正しくありません。");
            return;
          }

          const currentList = getSongList();
          const mergedList = [...currentList];
          let importedCount = 0;
          let updatedCount = 0;

          for (const song of backupData.songs) {
            if (!song || !isValidVideoId(song.videoId)) {
              continue;
            }

            const id = song.videoId;
            const alreadyExists = mergedList.includes(id);

            if (!alreadyExists) {
              mergedList.push(id);
              importedCount++;
            } else {
              updatedCount++;
            }

            if (song.savedSec !== null && song.savedSec !== undefined) {
              localStorage.setItem("sync_" + id, String(song.savedSec));
            }

            if (song.songInfo) {
              localStorage.setItem("song_info_" + id, JSON.stringify(song.songInfo));
            }

            if (song.detectSettings) {
              localStorage.setItem("detect_settings_" + id, JSON.stringify(song.detectSettings));
            }
          }

          saveSongList(mergedList);
          renderSongList();

          setBackupStatus(
            "復元しました。新規追加: " +
              importedCount +
              "件 / 上書き更新: " +
              updatedCount +
              "件"
          );
        } catch (error) {
          setBackupStatus("復元できませんでした。JSONファイルを確認してください。");
        } finally {
          event.target.value = "";
        }
      };

      reader.readAsText(file);
    }

    function clearAllSavedData() {
      const ok = confirm("保存済み曲リスト、再生位置、曲情報、音検知設定をすべて削除しますか？");

      if (!ok) {
        return;
      }

      const songIds = getSongList();

      for (const id of songIds) {
        localStorage.removeItem("sync_" + id);
        localStorage.removeItem("song_info_" + id);
        localStorage.removeItem("detect_settings_" + id);
      }

      localStorage.removeItem(songListKey);

      videoId = "";
      savedSec = null;
      detectOffsetSec = 0.0;
      detectThreshold = defaultThreshold;

      document.getElementById("videoInput").value = "";
      document.getElementById("currentVideoId").textContent = "未読み込み";
      document.getElementById("saved").textContent = "未保存";
      document.getElementById("songTitle").value = "";
      document.getElementById("artistName").value = "";
      document.getElementById("karaokeService").value = "";
      document.getElementById("songInfoStatus").textContent = "未保存";
      document.getElementById("detectStatus").textContent = "検知設定は未保存です";

      updateDetectSettingsView();
      renderSongList();

      setBackupStatus("全データを削除しました。");
    }

    function deleteSongData(targetVideoId) {
      const ok = confirm("この曲の保存情報を削除しますか？");

      if (!ok) {
        return;
      }

      localStorage.removeItem("sync_" + targetVideoId);
      localStorage.removeItem("song_info_" + targetVideoId);
      localStorage.removeItem("detect_settings_" + targetVideoId);
      removeVideoFromSongList(targetVideoId);

      if (videoId === targetVideoId) {
        videoId = "";
        savedSec = null;
        detectOffsetSec = 0.0;
        detectThreshold = defaultThreshold;

        document.getElementById("videoInput").value = "";
        document.getElementById("currentVideoId").textContent = "未読み込み";
        document.getElementById("saved").textContent = "未保存";
        document.getElementById("songTitle").value = "";
        document.getElementById("artistName").value = "";
        document.getElementById("karaokeService").value = "";
        document.getElementById("songInfoStatus").textContent = "未保存";
        document.getElementById("detectStatus").textContent = "検知設定は未保存です";
        updateDetectSettingsView();
      }

      renderSongList();
    }

    function setVideoStatus(message) {
      document.getElementById("videoStatus").textContent = message;
    }
  </script>
</body>
</html>
